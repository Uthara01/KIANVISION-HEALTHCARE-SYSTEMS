<!DOCTYPE html>
<html>
<head>
    <title>Medical Records - Healthcare Management System</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eaf4f4;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        h1 {
            color: #087e8b;
        }
        .container {
            max-width: 600px;
            margin: 20px auto;
        }
        .form-container, .list-container {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
            text-align: left;
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-top: 10px;
            font-weight: bold;
            color: #333;
        }
        input, select, textarea {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        textarea {
            resize: vertical;
            height: 80px;
        }
        button {
            width: 100%;
            padding: 10px;
            margin-top: 15px;
            background: #087e8b;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background: #0b5c64;
        }
        .back-btn {
            background: #6c757d;
            margin-top: 10px;
        }
        .back-btn:hover {
            background: #5a6268;
        }
        .record-card {
            border-left: 4px solid #087e8b;
            background: #f9f9f9;
            padding: 10px 15px;
            margin-top: 10px;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <h1>Patient Medical Records</h1>

    <div class="container">
        <!-- Add Medical Record Form -->
        <div class="form-container">
            <h3>Add Consultation Record</h3>
            <form id="recordForm">
                <label for="patientSelect">Select Patient:</label>
                <select id="patientSelect" required>
                    <!-- Populated dynamically -->
                </select>

                <label for="diagnosis">Diagnosis / Findings:</label>
                <input type="text" id="diagnosis" placeholder="e.g., Acute Bronchitis" required>

                <label for="prescription">Prescription / Medication:</label>
                <textarea id="prescription" placeholder="e.g., Amoxicillin 500mg - Twice daily" required></textarea>

                <label for="recordDate">Date:</label>
                <input type="date" id="recordDate" required>

                <button type="submit">Save Medical Record</button>
            </form>
            <button class="back-btn" onclick="window.location.href='healthcare.html'">Back to Home</button>
        </div>

        <!-- Medical Records Display -->
        <div class="list-container">
            <h3>Patient History Logs</h3>
            <div id="recordListDisplay"></div>
        </div>
    </div>

    <script>
        const patientSelect = document.getElementById('patientSelect');
        const form = document.getElementById('recordForm');
        const displayList = document.getElementById('recordListDisplay');

        // Populate patient dropdown from registered patients
        function loadPatientDropdown() {
            let patients = JSON.parse(localStorage.getItem('patients')) || [];
            patientSelect.innerHTML = '';
            
            if (patients.length === 0) {
                let opt = document.createElement('option');
                opt.textContent = 'No patients registered yet';
                opt.disabled = true;
                opt.selected = true;
                patientSelect.appendChild(opt);
            } else {
                patients.forEach(p => {
                    let opt = document.createElement('option');
                    opt.value = p.name;
                    opt.textContent = `${p.name} (Issue: ${p.disease})`;
                    patientSelect.appendChild(opt);
                });
            }
        }

        // Load existing records
        function loadRecords() {
            displayList.innerHTML = '';
            let records = JSON.parse(localStorage.getItem('medicalRecords')) || [];
            
            if (records.length === 0) {
                displayList.innerHTML = '<p style="color: #666; font-style: italic;">No medical records added yet.</p>';
                return;
            }

            records.forEach(rec => {
                let div = document.createElement('div');
                div.className = 'record-card';
                div.innerHTML = `
                    <strong>Patient: ${rec.patient}</strong> (${rec.date})<br>
                    <strong>Diagnosis:</strong> ${rec.diagnosis}<br>
                    <strong>Prescription:</strong> ${rec.prescription}
                `;
                displayList.appendChild(div);
            });
        }

        form.addEventListener('submit', function(e) {
            e.preventDefault();

            if (!patientSelect.value) {
                alert('Please register a patient first!');
                return;
            }

            const newRecord = {
                patient: patientSelect.value,
                diagnosis: document.getElementById('diagnosis').value,
                prescription: document.getElementById('prescription').value,
                date: document.getElementById('recordDate').value
            };

            let records = JSON.parse(localStorage.getItem('medicalRecords')) || [];
            records.push(newRecord);
            localStorage.setItem('medicalRecords', JSON.stringify(records));

            form.reset();
            loadPatientDropdown();
            loadRecords();
        });

        // Initialize page
        loadPatientDropdown();
        loadRecords();
    </script>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <title>Healthcare Management System - Dashboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eaf4f4;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        h1 {
            color: #087e8b;
        }
        .stats-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 20px auto;
            max-width: 800px;
            flex-wrap: wrap;
        }
        .stat-card {
            background: white;
            padding: 15px 20px;
            border-radius: 8px;
            box-shadow: 0px 0px 8px rgba(0,0,0,0.1);
            min-width: 150px;
            border-top: 4px solid #087e8b;
        }
        .stat-card h3 {
            margin: 0;
            color: #333;
            font-size: 24px;
        }
        .stat-card p {
            margin: 5px 0 0;
            color: #666;
            font-size: 14px;
        }
        .menu-container {
            background: white;
            max-width: 450px;
            margin: 20px auto;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
        }
        button {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            background: #087e8b;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background: #0b5c64;
        }
        .reset-btn {
            background: #d9534f;
        }
        .reset-btn:hover {
            background: #c9302c;
        }
    </style>
</head>
<body>

    <h1>Healthcare Management System</h1>
    <p>Welcome to the Hospital Administration Portal</p>

    <!-- Live Statistics Dashboard Widgets -->
    <div class="stats-container">
        <div class="stat-card">
            <h3 id="statPatients">0</h3>
            <p>Patients</p>
        </div>
        <div class="stat-card">
            <h3 id="statAppointments">0</h3>
            <p>Appointments</p>
        </div>
        <div class="stat-card">
            <h3 id="statBeds">0</h3>
            <p>Available Beds</p>
        </div>
        <div class="stat-card">
            <h3 id="statEmergencies">0</h3>
            <p>Active ER Cases</p>
        </div>
    </div>

    <!-- Navigation Hub -->
    <div class="menu-container">
        <h3>Modules Menu</h3>
        <button onclick="window.location.href='patient.html'">Patient Registration</button>
        <button onclick="window.location.href='appointments.html'">Appointments</button>
        <button onclick="window.location.href='doctor.html'">Doctor Details</button>
        <button onclick="window.location.href='records.html'">Medical Records</button>
        <button onclick="window.location.href='beds.html'">Bed Availability</button>
        <button onclick="window.location.href='emergency.html'">Emergency Cases</button>
        <button onclick="window.location.href='billing.html'">Billing & Invoices</button>
        
        <button class="reset-btn" onclick="resetSystem()">Reset All System Data</button>
    </div>

    <script>
        function loadStats() {
            // Patients count
            let patients = JSON.parse(localStorage.getItem('patients')) || [];
            document.getElementById('statPatients').textContent = patients.length;

            // Appointments count
            let apps = JSON.parse(localStorage.getItem('appointments')) || [];
            document.getElementById('statAppointments').textContent = apps.length;

            // Available beds calculation
            let beds = JSON.parse(localStorage.getItem('hospitalBeds')) || [
                { total: 50, occupied: 30 },
                { total: 15, occupied: 12 },
                { total: 20, occupied: 8 },
                { total: 10, occupied: 4 }
            ];
            let totalAvailable = beds.reduce((acc, w) => acc + (w.total - w.occupied), 0);
            document.getElementById('statBeds').textContent = totalAvailable;

            // Active emergencies count
            let emergencies = JSON.parse(localStorage.getItem('emergencyCases')) || [];
            document.getElementById('statEmergencies').textContent = emergencies.length;
        }

        function resetSystem() {
            if (confirm('Are you sure you want to clear all data and reset the system?')) {
                localStorage.clear();
                loadStats();
                alert('System data has been reset successfully!');
            }
        }

        loadStats();
    </script>

</body>
</html>

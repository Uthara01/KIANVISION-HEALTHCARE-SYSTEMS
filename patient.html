<!DOCTYPE html>
<html>
<head>
    <title>Patient Registration - Healthcare Management System</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eaf4f4;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        h1 {
            color: #087e8b;
        }
        .form-container {
            background: white;
            max-width: 400px;
            margin: 20px auto;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
            text-align: left;
        }
        label {
            display: block;
            margin-top: 10px;
            font-weight: bold;
            color: #333;
        }
        input, select {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 10px;
            margin-top: 15px;
            background: #087e8b;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background: #0b5c64;
        }
        .back-btn {
            background: #6c757d;
            margin-top: 10px;
        }
        .back-btn:hover {
            background: #5a6268;
        }
        .patient-list {
            max-width: 400px;
            margin: 20px auto;
            background: white;
            padding: 15px;
            border-radius: 8px;
            text-align: left;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
        }
        ul {
            padding-left: 20px;
        }
    </style>
</head>
<body>

    <h1>Patient Registration</h1>

    <div class="form-container">
        <form id="patientForm">
            <label for="fullName">Full Name:</label>
            <input type="text" id="fullName" required>

            <label for="age">Age:</label>
            <input type="number" id="age" required>

            <label for="gender">Gender:</label>
            <select id="gender">
                <option value="Male">Male</option>
                <option value="Female">Female</option>
                <option value="Other">Other</option>
            </select>

            <label for="disease">Disease / Symptom:</label>
            <input type="text" id="disease" required>

            <button type="submit">Register Patient</button>
        </form>
        <button class="back-btn" onclick="window.location.href='healthcare.html'">Back to Home</button>
    </div>

    <div class="patient-list">
        <h3>Registered Patients</h3>
        <ul id="patientListDisplay"></ul>
    </div>

    <script>
        // Load existing patients from browser storage when page opens
        const form = document.getElementById('patientForm');
        const displayList = document.getElementById('patientListDisplay');

        function loadPatients() {
            displayList.innerHTML = '';
            let patients = JSON.parse(localStorage.getItem('patients')) || [];
            patients.forEach(p => {
                let li = document.createElement('li');
                li.textContent = `${p.name} (${p.gender}, Age: ${p.age}) - Issue: ${p.disease}`;
                displayList.appendChild(li);
            });
        }

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            
            const newPatient = {
                name: document.getElementById('fullName').value,
                age: document.getElementById('age').value,
                gender: document.getElementById('gender').value,
                disease: document.getElementById('disease').value
            };

            let patients = JSON.parse(localStorage.getItem('patients')) || [];
            patients.push(newPatient);
            localStorage.setItem('patients', JSON.stringify(patients));

            form.reset();
            loadPatients();
        });

        // Run on load
        loadPatients();
    </script>

</body>
</html>
